[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-zero"
version = "0.1.0"
description = "AI On-Call Engineer agent for Bosch Incident Zero hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pydantic>=2.6",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "docker>=7.0",
  "openai>=1.40",
  "google-genai>=1.0",
  "pytest>=8.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[project.scripts]
incident-zero = "agent.main:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent", "tests"]
extend-exclude = ["docs", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
